<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team HML PHirst Homes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="PHirst Impressions Gen Tri and PHirst Editions Batulao: house models, photos, walkthrough videos, prices and payment estimates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{
  --paper:#F3F4F1; --surface:#FFFFFF; --ink:#1F2426; --muted:#5C6568; --line:#DCE0DA;
  --rust:#C2542D; --on-rust:#FFFFFF; --sage:#4F7F55; --sage-soft:#E3ECE1;
  --char:#23292B; --on-char:#F1F2EE;
  --ph:#2F8F46; --ph-on-dark:#7DD08F;
  --shadow:0 22px 44px -26px rgba(20,26,28,.55);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --accent:"Instrument Serif",Georgia,serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111415; --surface:#191E1F; --ink:#E8EBE7; --muted:#9AA3A3; --line:#2A3133;
    --rust:#E0693F; --on-rust:#1A0D07; --ph:#6FC883; --sage:#8BBB8E; --sage-soft:#1D2A21;
    --char:#0B0E0F; --on-char:#EDEFEA; --shadow:0 22px 44px -26px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111415; --surface:#191E1F; --ink:#E8EBE7; --muted:#9AA3A3; --line:#2A3133;
  --rust:#E0693F; --on-rust:#1A0D07; --ph:#6FC883; --sage:#8BBB8E; --sage-soft:#1D2A21;
  --char:#0B0E0F; --on-char:#EDEFEA; --shadow:0 22px 44px -26px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.02;letter-spacing:-.025em;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
img,video{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--rust);outline-offset:3px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.serif{font-family:var(--accent);font-style:italic;font-weight:400;letter-spacing:0}
.eyebrow{font:700 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
.todo{display:inline-block;font:500 12px/1.3 var(--body);color:var(--rust);border:1px dashed currentColor;border-radius:6px;padding:3px 8px}

/* seller bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:60px}
.back{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);flex:none}
.has-back .back{display:inline-flex}
.seller{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--char);color:var(--on-char);display:grid;place-items:center;font:700 14px var(--display);flex:none}
.seller small{display:block;font-size:12px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seller b{display:block;font-weight:600;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px;text-decoration:none;background:var(--rust);color:var(--on-rust);transition:transform .35s var(--ease),box-shadow .35s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}

/* reveal: always rests visible; only lifts in when armed below the fold */
.rv{transition:transform .9s var(--ease),opacity .9s var(--ease);transition-delay:calc(var(--d,0)*80ms)}
.rv.armed{transform:translateY(30px);opacity:.2}

/* ---------- HUB ---------- */
.hub-hero{padding-block:44px 24px;display:grid;gap:16px}
.hub-hero h1{font-size:clamp(42px,8vw,88px);font-weight:800}
.hub-hero h1 .serif{color:var(--rust)}
.ph{color:var(--ph)!important}
.hero .ph,.mhero .ph,.darkcard .ph,.cta .ph,.mcard .ph{color:var(--ph-on-dark)!important}
.hub-hero p{max-width:50ch;color:var(--muted);font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:20px;padding-block:12px 64px}
.pcard{position:relative;display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .5s var(--ease),box-shadow .5s}
.pcard:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.pcard .art{aspect-ratio:4/3;overflow:hidden;background:var(--char)}
.pcard .art img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.pcard:hover .art img{scale:1.06}
.pcard .meta{padding:18px 20px 22px;display:grid;gap:6px}
.pcard h2{font-size:30px}
.pcard .loc{color:var(--muted);font-size:14px}
.details{position:absolute;top:14px;right:14px;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 16px;border-radius:999px;background:var(--rust);color:var(--on-rust);font:600 14px/1 var(--body);box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
.details svg{width:16px;height:16px;transition:transform .45s var(--ease)}
.pcard:hover .details svg,.mcard:hover .details svg{transform:translateX(4px)}
.pcard.empty{border-style:dashed;display:grid;place-items:center;min-height:260px;color:var(--muted);text-align:center;padding:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--sage-soft);color:var(--sage)}

/* ---------- PROJECT HERO ---------- */
.hero{position:relative;background:var(--char);color:var(--on-char);overflow:hidden;min-height:min(92vh,760px);display:flex;align-items:flex-end}
.hero video,.hero .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:settle 2.6s var(--ease) both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,15,16,.25) 0%,rgba(12,15,16,.1) 35%,rgba(12,15,16,.88) 100%)}
.hero .wrap{position:relative;z-index:1;width:100%;padding-block:120px 34px;display:grid;gap:12px}
.hero .eyebrow{color:#F4B08F}
.hero h1{font-size:clamp(56px,13vw,150px);font-weight:800;letter-spacing:-.045em;line-height:.88}
.hero h1 .serif{display:block;font-size:.72em;letter-spacing:-.01em;color:#F4B08F;line-height:1}
.hero .lede{font-size:clamp(17px,2.3vw,21px);max-width:38ch;opacity:.9}
.words>span{display:inline-block;animation:rise 1s var(--ease) both;animation-delay:calc(var(--i)*110ms + 150ms)}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hero-chips a{font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid rgba(241,242,238,.35);background:rgba(241,242,238,.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-decoration:none;animation:rise .8s var(--ease) both;animation-delay:calc(var(--i)*90ms + 650ms);transition:background .3s}
.hero-chips a:hover{background:rgba(241,242,238,.2)}
.scrollcue{width:1px;height:44px;background:linear-gradient(var(--on-char),transparent);margin-top:14px;animation:cue 2s ease-in-out infinite;transform-origin:top}

/* sections */
section.block{padding-block:72px 8px;scroll-margin-top:80px}
@media (max-width:600px){section.block{padding-block:44px 4px}.cta{margin-block:48px 24px!important}}
.head{display:grid;gap:10px;margin-bottom:28px}
.head h2{font-size:clamp(32px,5.4vw,54px)}
.head h2 .serif{color:var(--rust)}
.head p{color:var(--muted);max-width:58ch}

/* value stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px}
.stat .n{font:800 clamp(44px,7vw,64px)/1 var(--display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.stat .n small{font-size:.36em;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px}
.stat .l{color:var(--muted);font-size:14px;margin-top:8px}
.stat.hl{background:var(--char);color:var(--on-char);border-color:var(--char)}
.stat.hl .n small,.stat.hl .l{color:color-mix(in srgb,var(--on-char) 70%,transparent)}

/* lot to scale */
.lots{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:18px}
.lots .row{display:flex;align-items:flex-end;gap:36px;flex-wrap:wrap}
.lot{display:grid;gap:8px;justify-items:start}
.lot .sq{box-sizing:content-box;background:repeating-linear-gradient(135deg,var(--sage-soft) 0 8px,transparent 8px 14px);border:2px solid var(--sage);border-radius:4px;position:relative;transform-origin:bottom left;transition:transform 1.2s var(--ease);transition-delay:calc(var(--d,0)*160ms)}
.lot .sq i{position:absolute;background:var(--rust);opacity:.9;border-radius:2px}
.lot .sq em{position:absolute;font:600 10px/1.1 var(--body);font-style:normal;color:var(--muted);white-space:nowrap}
.street{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:2px dashed var(--line);padding-top:6px;width:100%}
.lots.armed .sq{transform:scaleY(.08)}
.lot b{font:700 18px var(--display)}
.lot span{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* model cards */
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.mcard{position:relative;display:block;text-decoration:none;border-radius:24px;overflow:hidden;background:var(--char);color:var(--on-char);aspect-ratio:4/5;max-height:640px;width:100%}
.mcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease),opacity .8s}
.mcard img.alt{opacity:0}
.mcard:hover img{scale:1.05}
.mcard:hover img.alt{opacity:1}
.mcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(12,15,16,.9))}
.mcard .txt{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px;display:grid;gap:8px}
.mcard h3{font-size:clamp(34px,5vw,46px)}
.mcard .kind{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:#F4B08F}
.mcard .spec{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;opacity:.9}
.mcard .spec b{font:700 18px var(--display)}

/* inclusions */
.incl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.inc{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:500}
.inc svg{width:26px;height:26px;flex:none;color:var(--sage)}
.inc svg path{stroke-dasharray:30;stroke-dashoffset:0;transition:stroke-dashoffset .8s var(--ease);transition-delay:calc(var(--d,0)*70ms + 250ms)}
.inc.armed svg path{stroke-dashoffset:30}
.note{margin-top:14px;display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--muted);border-left:3px solid var(--rust);padding:4px 0 4px 14px}
.note b{color:var(--ink)}

/* computation */
.comp{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:16px;align-content:start}
.panel h3{font-size:22px}
.kv{display:grid;gap:10px}
.kv div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line);padding-bottom:10px}
.kv div:last-child{border:0;padding:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.kv .big dd{font:800 22px var(--display)}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{position:relative;z-index:1;padding:9px 6px;border-radius:999px;font-weight:600;font-size:14px;transition:color .35s}
.seg button[aria-pressed="true"]{color:var(--on-rust)}
.seg button{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,3));border-radius:999px;background:var(--rust);transition:transform .5s var(--ease)}
.ma{font:800 clamp(46px,8vw,68px)/1 var(--display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.ma small{font-size:.34em;font-weight:600;color:var(--muted);letter-spacing:0}
.months{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;align-items:end;height:90px}
.months i{display:block;border-radius:3px 3px 0 0;background:var(--sage);height:var(--h);transform-origin:bottom;transition:transform .9s var(--ease);transition-delay:calc(var(--d)*45ms)}
.months i.r{background:var(--rust)}
.panel.armed .months i{transform:scaleY(0)}
.mlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted)}

/* map */
:root{--water:#D6E6EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--water:#15282E}}
:root[data-theme="dark"]{--water:#15282E}
.locgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:stretch}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;display:grid;gap:8px}
.mapcard svg{width:100%;height:auto;display:block;border-radius:14px;background:var(--paper)}
.mapcard .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 6px 2px;font-size:12px;color:var(--muted)}
.map .route{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 2.4s var(--ease) .3s}
.mapcard.armed .map .route{stroke-dashoffset:1}
.map .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.map text{font-family:var(--body);fill:var(--muted);font-size:11px;font-weight:600}
.map .big{font:700 13px var(--display);fill:var(--ink)}
.map .water-l{fill:var(--sage);opacity:.7;font-style:italic;font-weight:500;font-size:12px}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
/* amenities */
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
.am{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px;align-content:start;transition:transform .45s var(--ease),border-color .45s}
.am:hover{transform:translateY(-4px);border-color:var(--sage)}
.am svg{width:38px;height:38px;stroke:var(--sage);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.am svg>*{stroke-dasharray:100;stroke-dashoffset:0;transition:stroke-dashoffset 1.4s var(--ease);transition-delay:calc(var(--d,0)*70ms + 200ms)}
.am.armed svg>*{stroke-dashoffset:100}
.am b{font:700 17px/1.15 var(--display)}
.am span{font-size:13px;color:var(--muted)}
.am{text-align:left;width:100%;cursor:pointer;position:relative}
.am .more{position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:transform .45s var(--ease),background .3s,color .3s}
.am[aria-expanded="true"]{border-color:var(--rust)}
.am[aria-expanded="true"] .more{transform:rotate(45deg);background:var(--rust);color:var(--on-rust);border-color:var(--rust)}
.am-panel{grid-column:1/-1;display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.am-panel.open{grid-template-rows:1fr}
.am-panel>div{overflow:hidden;min-height:0}
.am-card{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;align-items:center;background:var(--char);color:var(--on-char);border-radius:18px;padding:12px;margin-block:2px}
.am-card img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;animation:settle 1.2s var(--ease) both}
.am-card .ph-slot{aspect-ratio:16/10;border-radius:12px;display:grid;place-items:center;text-align:center;gap:6px;padding:16px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px);border:1px dashed rgba(255,255,255,.25)}
.am-card .ph-slot svg{width:54px;height:54px;stroke:#F4B08F;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin:0 auto}
.am-card .txt{display:grid;gap:8px;padding:8px}
.am-card h3{font-size:26px}
.am-card p{opacity:.8}

/* location + trust */
.duo{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.darkcard{background:var(--char);color:var(--on-char);border-radius:20px;padding:24px;display:grid;gap:12px;align-content:start;position:relative;overflow:hidden}
.darkcard h3{font-size:26px}
.darkcard p{opacity:.82}
.pin{width:30px;height:30px;color:#F4B08F;animation:drop 1.3s var(--ease) both}
.road{height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,#F4B08F 0 14px,transparent 14px 24px);background-size:24px 3px;animation:drive .9s linear infinite;opacity:.8}
.trust{display:grid;gap:12px}
.trust li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.trust svg{width:22px;height:22px;flex:none;color:var(--sage);margin-top:2px}
.trust{padding:0;margin:0}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px;grid-auto-flow:dense}
.gal button{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--line)}
.gal button.w{grid-column:span 2;aspect-ratio:auto}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.gal button:hover img{scale:1.05}
.gal button span{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:600;background:rgba(12,15,16,.62);color:#fff;padding:3px 8px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.gal .in{animation:wipe .9s var(--ease) both;animation-delay:calc(var(--d)*55ms)}
.toggle{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:12px}
.toggle button{position:relative;z-index:1;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:color .35s;white-space:nowrap}
.toggle button[aria-pressed="true"]{color:var(--on-char)}
.toggle .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--char);transition:transform .5s var(--ease)}
.toggle-note{font-size:14px;color:var(--muted);margin-bottom:16px;min-height:1.5em}

/* videos */
.vids{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.vids::-webkit-scrollbar{display:none}
.vid{flex:0 0 min(78%,300px);scroll-snap-align:start;display:grid;gap:8px}
.vid video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:18px;background:var(--char)}
.vid b{font-weight:600}
.vid span{font-size:13px;color:var(--muted)}

/* model page */
.mhero{position:relative;height:min(78vh,680px);overflow:hidden;background:var(--char);color:var(--on-char)}
.mhero img{position:absolute;inset:-8% 0 0 0;width:100%;height:108%;object-fit:cover;will-change:transform;animation:settle 2.2s var(--ease) both}

function fitRect(nw,nh){

  const s=Math.min(W/nw,H/nh); const w=nw*s, h=nh*s;

function lightbox(list, i, fromEl){

  const lb=root.firstChild, im=lb.querySelector("img"), cap=lb.querySelector(".cap");

    const r=fitRect(nw,nh);

    if(animateFrom && !reduce){

    const go=()=>place(im,im.naturalWidth,im.naturalHeight,from);

  };
  const step=d=>{ if(reduce){show(cur+d);return;} im.style.opacity=0; im.style.transform=`translateX(${-d*40}px)`; setTimeout(()=>{ im.style.transition="none"; im.style.transform=`translateX(${d*40}px)`; show(cur+d); requestAnimationFrame(()=>{ im.style.transition=""; im.style.opacity=1; im.style.transform="none"; }); },220); };
  const close=()=>{
    const thumbs=document.querySelectorAll("#gal img, .planImg, .siteImg"); const t=[...thumbs].find(x=>x.getAttribute("src")===list[cur][0]);
    lb.classList.remove("on");
    if(t && !reduce){ const f=t.getBoundingClientRect(), r=im.getBoundingClientRect(); im.style.transform=`translate(${f.left-r.left}px,${f.top-r.top}px) scale(${f.width/r.width},${f.height/r.height})`; }

}

function locMap(g){

  const px=+x(g.pin[0]), py=+y(g.pin[1]);

    ${(g.lm||[]).map(([type,lo,la,t,dx=10,dy=4,anchor="start"])=>{ const cx=+x(lo), cy=+y(la);
      return `<g class="lmk">${lmIcon(type,cx,cy)}<text class="lml" x="${cx+dx}" y="${cy+dy}" text-anchor="${anchor}">${t}</text></g>`; }).join("")}
    ${g.places.map(dot).join("")}

    <g style="animation:drop 1.3s var(--ease) both"><path d="M${px} ${py} c-9 -12 -13 -17 -13 -24 a13 13 0 0 1 26 0 c0 7 -4 12 -13 24z" fill="var(--rust)"/><circle cx="${px}" cy="${py-24}" r="5" fill="var(--surface)"/></g>
    <rect x="${bx}" y="${by}" width="140" height="36" rx="8" fill="var(--char)"/>

    }catch(e){ return fallback(); }
    box.querySelector(".map3d-hint")?.remove();
    map.addControl(new maplibregl.NavigationControl({ visualizePitch:true, showZoom:true }), "top-right");
    // project pin → Google Maps directions to the exact spot
    const pe=document.createElement("a"); pe.className="mk-pin"; pe.target="_blank"; pe.rel="noopener";
    pe.href=`https://www.google.com/maps/dir/?api=1&destination=${pin[1]},${pin[0]}`;
    pe.innerHTML=`<span class="mk-pulse"></span><span class="mk-card"><b>${near.pinTitle}</b><small>Get directions →</small></span>`;
    new maplibregl.Marker({ element:pe, anchor:"bottom" }).setLngLat(pin).addTo(map);
    // landmarks → Google Maps search
    const addMk=(lo,la,type,label)=>{ const a=document.createElement("a"); a.className="mk"; a.target="_blank"; a.rel="noopener";
      a.href=gmSearch(GQ[label]||label); a.innerHTML=`<svg viewBox="-9 -9 18 18" width="22" height="22" aria-hidden="true">${lmIcon(type,0,0)}</svg><span>${label}</span>`;
      new maplibregl.Marker({ element:a, anchor:"left" }).setLngLat([lo,la]).addTo(map); };
    [...(near.lm||[]),...(near.lm3d||[])].forEach(([type,lo,la,label])=>addMk(lo,la,type,label));
    (far.places||[]).filter(pl=>!near.lm?.some(l=>l[3]===pl[2])).forEach(([lo,la,label])=>addMk(lo,la,"place",label));
    [...(near.peaks||[])].forEach(([lo,la,label])=>addMk(lo,la,"place",label));
    map.on("load",()=>{
      if(far.route){ map.addSource("route",{ type:"geojson", data:{ type:"Feature", geometry:{ type:"LineString", coordinates:far.route } } });
        map.addLayer({ id:"route-glow", type:"line", source:"route", paint:{ "line-color":"#E0693F", "line-width":10, "line-opacity":0.18, "line-blur":6 } });
        map.addLayer({ id:"route", type:"line", source:"route", paint:{ "line-color":"#E0693F", "line-width":3 } });
        showRoute(false); }
      if(reduce){ map.jumpTo(views[0]); return; }
      map.flyTo({ ...views[0], duration:4200, curve:1.3, essential:true });
      map.once("moveend",()=>orbit());
    });
    const lons=far.route?far.route.map(c=>c[0]):[pin[0]], lats=far.route?far.route.map(c=>c[1]):[pin[1]];
    const views=[
      { center:pin, zoom:near.zoom3d||13.4, pitch:62, bearing:-28 },
      { center:[(Math.min(...lons)+Math.max(...lons))/2,(Math.min(...lats)+Math.max(...lats))/2], zoom:far.zoom3d||9.6, pitch:45, bearing:-12 }
    ];
    // the drawn route is approximate: only show it on the zoomed-out "getting there" view
    const showRoute=on=>["route","route-glow"].forEach(l=>map.getLayer(l)&&map.setLayoutProperty(l,"visibility",on?"visible":"none"));
    let spinning=false, raf=0;
    const orbit=()=>{ if(reduce) return; spinning=true; const step=()=>{ if(!spinning) return; map.setBearing(map.getBearing()+0.045); raf=requestAnimationFrame(step); }; raf=requestAnimationFrame(step); };
    const stop=()=>{ spinning=false; cancelAnimationFrame(raf); };
    ["mousedown","touchstart","wheel"].forEach(ev=>box.addEventListener(ev,stop,{ passive:true }));
    new IntersectionObserver(es=>{ es.forEach(e=>{ if(!e.isIntersecting) stop(); }); }).observe(box);
    const t=$(".mapt");
    if(t) wireSegBtns(t,b=>{ stop(); const i=+b.dataset.v; $("#maplegend").firstChild && ($("#maplegend").innerHTML=mapLegend(i===0&&P.maps[0].lm3d?{...P.maps[0],lm:[...P.maps[0].lm,...P.maps[0].lm3d]}:P.maps[i])+'<span style="margin-left:auto">Tap a place to open it in Google Maps</span>');
      showRoute(i===1); map.flyTo({ ...views[i], duration:reduce?0:2600, essential:true }); if(i===0) map.once("moveend",()=>orbit()); });
  }
  function fallback(){ box.outerHTML=`<div id="mapbox">${locMap(P.maps[0])}</div>`; wireMap(P); }
}

/* ---------- scroll parallax for photos in frames ---------- */
const PX=new Set(); let pxRaf=0;
const pxIO=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?PX.add(e.target):PX.delete(e.target)),{ rootMargin:"120px" });
function pxUpdate(){ pxRaf=0; const vh=innerHeight;
  PX.forEach(im=>{ const b=im.parentElement.getBoundingClientRect();
    const c=(b.top+b.height/2-vh/2)/(vh/2+b.height/2);                 // +1 entering at bottom … -1 leaving at top
    im.style.setProperty("--py", (-Math.max(-1,Math.min(1,c))*b.height*0.075).toFixed(1)+"px"); }); }
addEventListener("scroll",()=>{ if(!pxRaf) pxRaf=requestAnimationFrame(pxUpdate); },{ passive:true });
addEventListener("resize",()=>{ if(!pxRaf) pxRaf=requestAnimationFrame(pxUpdate); });
function armParallax(){
  if(reduce) return;
  document.querySelectorAll(".mcard img, .pcard .art img, .gal button img, .am-card img").forEach(im=>{ if(!im.classList.contains("px")){ im.classList.add("px"); pxIO.observe(im); } });
  requestAnimationFrame(pxUpdate);
}
function nudge(text){
  return `<div class="nudge rv"><span>${text}</span><a class="btn" href="${msg("book",CUR)}" target="_blank" rel="noopener">${cal}Book a free tripping</a></div>`;
}
function wireStickyBook(on){
  const bar=$("#stickyBook");
  bar.hidden=!on; if(!on){ onscroll=null; return; }
  const hero=$(".hero,.mhero"), end=$(".cta");
  const f=()=>{ const past=hero?hero.getBoundingClientRect().bottom<60:true; const atEnd=end?end.getBoundingClientRect().top<innerHeight:false; bar.classList.toggle("show",past&&!atEnd); };
  onscroll=f; f();
}

/* ---------- card photo flies into the model page's hero (works in every browser) ---------- */
function heroFly(id, card){
  const src=card.querySelector("img");
  if(!src||reduce){ location.hash=id; return; }
  const R=card.getBoundingClientRect(), rad=parseFloat(getComputedStyle(card).borderRadius)||22;   // the frame, not the (oversized, parallaxed) photo
  const cl=src.cloneNode(); cl.className="xclone";
  Object.assign(cl.style,{ left:R.left+"px", top:R.top+"px", width:R.width+"px", height:R.height+"px", borderRadius:rad+"px" });
  document.body.appendChild(cl);
  let done=false; const next=()=>{ if(done) return; done=true; window.__fly={ R, rad, cl }; location.hash=id; };
  $("#app").animate([{opacity:1},{opacity:0}],{ duration:200, easing:"ease-out", fill:"forwards" }).onfinish=next;
  setTimeout(next, 320);
}
function landHero(){
  const { R, rad, cl }=window.__fly; window.__fly=null;
  const app=$("#app"); app.getAnimations().forEach(a=>a.cancel());
  const sec=$(".mhero"), im=$("#par");
  if(!im){ cl.remove(); return; }
  im.style.animation="none"; sec.style.overflow="visible"; sec.style.zIndex="35";
  const F=im.getBoundingClientRect();
  const s=Math.max(R.width/F.width, R.height/F.height);
  const dx=R.left+R.width/2-F.left-s*F.width/2, dy=R.top+R.height/2-F.top-s*F.height/2;
  const l=(R.left-F.left-dx)/s, t=(R.top-F.top-dy)/s, r=F.width-(R.right-F.left-dx)/s, b=F.height-(R.bottom-F.top-dy)/s;
  im.style.transformOrigin="0 0";
  const a=im.animate([
    { transform:`translate(${dx}px,${dy}px) scale(${s})`, clipPath:`inset(${t}px ${r}px ${b}px ${l}px round ${rad/s}px)` },
    { transform:"translate(0px,0px) scale(1)", clipPath:"inset(0px 0px 0px 0px round 0px)" }
  ],{ duration:640, easing:"cubic-bezier(.2,.85,.25,1.06)" });
  requestAnimationFrame(()=>cl.remove()); setTimeout(()=>cl.remove(), 80);
  [...app.children].forEach(el=>{ if(el!==sec) el.animate([{opacity:0,transform:"translateY(18px)"},{opacity:1,transform:"none"}],{ duration:520, delay:300, easing:"cubic-bezier(.16,1,.3,1)", fill:"backwards" }); });
  sec.querySelectorAll(".wrap").forEach(w=>w.animate([{opacity:0},{opacity:1}],{ duration:420, delay:320, fill:"backwards" }));
  let fin=false; const finish=()=>{ if(fin) return; fin=true; a.cancel(); im.style.transformOrigin=""; sec.style.overflow=""; sec.style.zIndex=""; sec.classList.remove("flying"); };
  a.onfinish=finish; setTimeout(finish, 900);
}
function amort(P,rate,years){ const r=rate/12, n=years*12; return P*r/(1-Math.pow(1+r,-n)); }
function tween(el,to,fmt,ms=700){
  const from=+(el.dataset.v||0); el.dataset.v=to;
  if(reduce||!from){ el.innerHTML=fmt(to); return; }
  const t0=performance.now();
  (function f(t){ const k=Math.min(1,(t-t0)/ms), e=1-Math.pow(1-k,3); el.innerHTML=fmt(from+(to-from)*e); if(k<1) requestAnimationFrame(f); })(t0);
}
function wireSegBtns(seg,onPick){
  const btns=[...seg.querySelectorAll("button")], pill=seg.querySelector(".pill");
  btns.forEach((b,i)=>b.onclick=()=>{ btns.forEach(x=>x.setAttribute("aria-pressed",x===b)); pill.style.transform=`translateX(${i*100}%)`; onPick(b); });
}
function wireFin(el,panes){
  wireSegBtns(el,b=>{ Object.entries(panes).forEach(([k,p])=>p.hidden=k!==b.dataset.f); const show=panes[b.dataset.f];
    if(!reduce) show.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:500,easing:"cubic-bezier(.16,1,.3,1)"}); });
}
function wireTerms(seg,out,valueFor){
  let val=valueFor(20);
  wireSegBtns(seg,b=>{
    const from=val, to=valueFor(+b.dataset.y); val=to;
    if(reduce){ out.innerHTML=peso(to)+"<small> /month</small>"; return; }
    const t0=performance.now();
    (function f(t){ const k=Math.min(1,(t-t0)/700), e=1-Math.pow(1-k,3); out.innerHTML=peso(from+(to-from)*e)+"<small> /month</small>"; if(k<1) requestAnimationFrame(f); })(t0);
  });
}
function wireSeg(P){
  if(!P.comps) return;
  const wireBody=c=>{
    const pag=y=>c.ma?c.ma[y]:amort(c.balance,0.0625,y);
    wireTerms($('.seg[data-plan="pagibig"]'), $("#ma"), pag);
    wireTerms($('.seg[data-plan="bank"]'), $("#maBank"), y=>amort(c.balance,P.bankRate,y));
    wireFin($(".fin"), { pagibig: $("#finPagibig"), bank: $("#finBank") });
  };
  wireBody(P.comps[0]);
  const sw=$("#compModel");
  if(sw) wireSegBtns(sw,b=>{ const c=P.comps[+b.dataset.c], body=$("#compBody");
    body.innerHTML=compBody(P,c); wireBody(c); paintPH(body);
    if(!reduce) body.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:450,easing:"cubic-bezier(.16,1,.3,1)"}); });
}
function wireCalc(P){
  if(!$("#calcModel")) return;
  const k=P.calc; let mid=Object.keys(P.models)[0], yB=20, yP=20;
  const mo=v=>peso(v)+"<small> /month</small>";
  const upd=()=>{
    const tcp=priceOf(mid)||0, bal=tcp*.9;
    tween($("#cTcp"),tcp,v=>peso(v));
    tween($("#cDp"),tcp*.1,v=>peso(v,2)); tween($("#cMo"),tcp*.1/12,v=>peso(v,2)); tween($("#cBal"),bal,v=>peso(v,2));
    tween($("#cMaBank"),amort(bal,k.bankRate,yB),mo);
    const ok=bal<=k.pagMax;
    if(ok) tween($("#cMaPag"),amort(bal,k.pagRate,yP),mo); else { $("#cMaPag").dataset.v=0; $("#cMaPag").innerHTML="—"; }
    $("#yPag").style.opacity=ok?1:.4;
    $("#cPagNote").textContent = ok
      ? `Pag-IBIG at ${(k.pagRate*100).toFixed(2)}%, fixed for the first 3 years. You need at least 24 monthly contributions, and the final loan amount depends on Pag-IBIG's approval.`
      : `The ${peso(bal)} balance is above Pag-IBIG's ₱6M maximum loan, so the ${P.models[mid].name} is financed through a bank.`;
  };
  wireSegBtns($("#calcModel"),b=>{ mid=b.dataset.m; upd(); });
  wireSegBtns($("#yBank"),b=>{ yB=+b.dataset.y; upd(); });
  wireSegBtns($("#yPag"),b=>{ yP=+b.dataset.y; upd(); });
  wireFin($(".fin2"), { bank: $("#cBank"), pagibig: $("#cPag") });
  upd();
}
let parRaf;
function wireParallax(){
  const p=$("#par"); if(!p||reduce) return;
  const f=()=>{ p.style.transform=`translateY(${Math.min(scrollY,700)*0.25}px)`; };
  addEventListener("scroll",()=>{ cancelAnimationFrame(parRaf); parRaf=requestAnimationFrame(f); },{passive:true});
}

/* ---------- view tracking (Cloudflare site only; build_site.py sets window.EVENTS_ENDPOINT) ---------- */
// A personal link (…/batulao?c=<client id>) lets the Worker tell Zapier exactly who finished viewing.
const CLIENT = (()=>{ let c=null; try{ c=new URLSearchParams(location.search).get("c"); }catch(e){} return c ? c.replace(/[^\w.-]/g,"").slice(0,80) : ""; })();
const TRACK = { start: Date.now(), projects: new Set(), models: new Set(), taps: [], sent: false };
document.addEventListener("click", e=>{ const a=e.target.closest && e.target.closest('a[href*="m.me/"]'); if(!a) return;
  let r=""; try{ r=new URL(a.href).searchParams.get("ref")||""; }catch(e){} TRACK.taps.push(r||"message"); });
function sendViewEnd(){
  const ep=window.EVENTS_ENDPOINT; if(!ep || TRACK.sent) return;
  const seconds=Math.round((Date.now()-TRACK.start)/1000); if(seconds<8) return;
  TRACK.sent=true;
  const body=JSON.stringify({ event:"view_end", client:CLIENT, page:ORIGIN, projects:[...TRACK.projects], models:[...TRACK.models], taps:TRACK.taps, seconds, landing:location.pathname });
  try{ navigator.sendBeacon(ep, new Blob([body],{type:"application/json"})); }catch(e){ try{ fetch(ep,{method:"POST",body,keepalive:true}); }catch(_){} }
}
addEventListener("pagehide", sendViewEnd);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") sendViewEnd(); });

/* ---------- open Messenger in the app, not a browser login page ---------- */
// Inside Facebook/Messenger's built-in browser, a new-window link gets pushed out to Chrome/Safari,
// where m.me asks the client to log in. Opening it in the same window lets the app catch it.
const UA=navigator.userAgent||"", INAPP=/FBAN|FBAV|FB_IAB|FBIOS|Messenger|Orca-Android|Instagram/i.test(UA),
      ANDROID=/Android/i.test(UA), IOS=/iPhone|iPad|iPod/i.test(UA);
document.addEventListener("click", e=>{
  const a=e.target.closest && e.target.closest('a[href*="m.me/"]'); if(!a || e.metaKey || e.ctrlKey) return;
  if(INAPP || IOS){ e.preventDefault(); location.href=a.href; return; }            // app / universal link takes over
  if(ANDROID && SELLER.pageId){ e.preventDefault();                                 // Android: open the Messenger app, fall back to m.me
    location.href=`intent://user-thread/${SELLER.pageId}#Intent;scheme=fb-messenger;package=com.facebook.orca;S.browser_fallback_url=${encodeURIComponent(a.href)};end`; }
});

/* ---------- router ---------- */
function render(){
  let id=location.hash.slice(1);
  if(FOCUS && !id) id=FOCUS_MODEL||FOCUS.id;                           // project/model link: land there first
  const P=PROJECTS.find(p=>p.id===id);
  let back=null;
  if(MODELS[id]){ CUR=MODELS[id].P; $("#app").innerHTML=modelView(id); back="#"+CUR.id; }
  else if(P){ CUR=P; $("#app").innerHTML=projectView(P); back=FOCUS?"#all":"#"; }
  else { CUR=null; $("#app").innerHTML=hubView(); }
  document.body.classList.toggle("has-back",!!back);
  if(FOCUS) document.title = CUR ? `${CUR.brand} ${CUR.name}${MODELS[id]?" · "+MODELS[id].name:""}` : "Team HML PHirst Homes";
  if(back) $("#back").href=back;
  $("#lbRoot").innerHTML="";
  window.scrollTo(0,0);
  if(MODELS[id]){
    wireToggle(id); wireParallax();
    const pis=[...document.querySelectorAll(".planImg")], pl=pis.map(x=>[x.getAttribute("src"), x.nextElementSibling.textContent+" plan"]);
    pis.forEach(x=>x.onclick=()=>lightbox(pl,+x.dataset.i,x));
  }
  if(P){ document.querySelectorAll(".mcard").forEach(a=>a.addEventListener("click",e=>{ if(e.metaKey||e.ctrlKey) return; e.preventDefault(); heroFly(a.getAttribute("href").slice(1), a); }));
    const sis=[...document.querySelectorAll(".siteImg")], sl=sis.map(x=>[x.getAttribute("src"), x.nextElementSibling.textContent+" sales map"]);
    sis.forEach(x=>x.onclick=()=>lightbox(sl,+x.dataset.i,x));
    wireAmen(P); wireSeg(P); wireCalc(P); if(USE3D) wireMap3d(P); else wireMap(P); const v=$(".bgv"); if(v&&!reduce) v.play?.().catch(()=>{}); }
  paintPH($("#app"));
  wireStickyBook(!!CUR);
  if(CUR) TRACK.projects.add(CUR.slug); if(MODELS[id]) TRACK.models.add(id);
  $("#msgBtn").href=msg("book",CUR,MODELS[id]?id:null); $("#stickyBtn").href=msg("book",CUR,MODELS[id]?id:null);
  armReveals();
  pxIO.disconnect(); PX.clear(); armParallax();
  if(window.__fly) landHero();
}
function paintPH(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), hits=[];
  while(w.nextNode()){ const n=w.currentNode; if(n.nodeValue.includes("PHirst") && !n.parentElement.closest(".ph,title,script,style,svg")) hits.push(n); }
  hits.forEach(n=>{ const f=document.createDocumentFragment();
    n.nodeValue.split(/(PHirst)/).forEach(t=>{ if(t==="PHirst"){ const s=document.createElement("span"); s.className="ph"; s.textContent=t; f.appendChild(s);} else if(t) f.appendChild(document.createTextNode(t)); });
    n.replaceWith(f); });
}
function go(){ if(window.__fly){ render(); return; } if(document.startViewTransition && !reduce){ const t=document.startViewTransition(render); t.ready.catch(()=>{}); t.finished.catch(()=>{}); t.updateCallbackDone.catch(()=>{}); } else render(); }

$("#sellerInitials").innerHTML='<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M36 34h-12v6c0 12 7 19 16 21M84 34h12v6c0 12-7 19-16 21" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M34 22h52v18c0 19-12 32-26 32S34 59 34 40z" fill="#F4B08F"/><rect x="54" y="72" width="12" height="12" fill="#F4B08F"/><rect x="40" y="84" width="40" height="9" rx="3" fill="currentColor"/><rect x="32" y="95" width="56" height="10" rx="3" fill="currentColor"/></svg>';
